[project]
name = "training-data-packer"
version = "0.1.0"
description = "Packaging annotated datasets into final training data."
authors = [
    { name = "Magnus Runesson", email = "Magnus.Runesson@ai.se" },
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "loguru>=0.7.3",
    "orjson>=3.11.8",
    "pyarrow>=20.0.0",
    "pyyaml>=6.0.3",
    "zstandard>=0.25.0",
    "iso639-lang>=2.6.3",
    "scipy>=1.17.1",
    "numpy>=2.4.6",
    "scipy-stubs~=1.17.1",
    "transformers~=5.14.1",
    "jsonschema>=4.26.0",
    "referencing>=0.37.0",
    "jsonpath-ng>=1.8.0",
    "glom>=25.12.0",
]

[project.urls]
repository = "https://github.com/OpenEuroLLM/training-data-packer"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<9.1",
    "parameterized>=0.9.0",
    "pre-commit>=4.6.0",
    "ruff>=0.16.8",
    "coverage==7.14.0",
]

[project.scripts]
oellm-package-data = "training_data_packer.package:main"
oellm-package-merge = "training_data_packer.merge:main"
oellm-collect-metrics = "training_data_packer.collect_metrics:main"
oellm-propella-structure = "training_data_packer.propella_structure:main"
oellm-propella-merge = "training_data_packer.propella_merge:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "training_data_packer"
module-root = ""

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
ignore = [
    "C417",  # Unnecessary `map` or `filter` where a comprehension could be used
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D107", # Missing docstring in __init__
]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "D", # Doc style
    "RUF", # Ruff specific rules.
    "PLC", # Pylint
    "PLE", # Pylint
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
